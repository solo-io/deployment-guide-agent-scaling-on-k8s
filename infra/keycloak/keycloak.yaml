# Reference Keycloak for the kagent UI and API, in-cluster. Pattern from the SP-02 guide
# (deployment-guide-mcp-optimization-on-k8s, Step 12), Keycloak 26.2.5.
#
# Two Secrets must exist in namespace keycloak before this is applied, neither committed:
#   keycloak-admin  key password   - the bootstrap admin password
#   keycloak-realm  key realm.json - infra/keycloak/kagent-realm.template.json with its
#                                    ${...} placeholders filled from environment variables
#
# KC_HOSTNAME is what Keycloak writes into every token's iss claim, and the kagent controller
# validates iss against enterprise.oidc.issuer. The browser and the controller must use the same
# URL: keycloak.localtest.me resolves to 127.0.0.1 on the workstation (a port-forward on 18080) and,
# through infra/keycloak/coredns-localtest.sh, to this Service inside the cluster, which therefore
# listens on 18080 too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2.5
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME
              value: "http://keycloak.localtest.me:18080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/kagent/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 40
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          secret:
            secretName: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 18080
      targetPort: 8080
