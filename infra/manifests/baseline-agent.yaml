# Baseline agent: one AgentTemplate (what the agent is), one Harness (what runs it), and the Agent
# that pairs them. kagent-enterprise 1.0.0-alpha8, kagent runtime 1.0.0-alpha9.
#
# The Anthropic key lives in Secret `kagent-anthropic`, created before this is applied.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: anthropic
  namespace: kagent
spec:
  provider: Anthropic
  # The chart's default Anthropic model (providers.anthropic.model in values.yaml).
  model: claude-haiku-4-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: baseline
  namespace: kagent
spec:
  description: Baseline agent with no tools.
  modelConfig:
    name: anthropic
  systemPrompt: |
    You are a helpful assistant. Answer concisely.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent
  namespace: kagent
spec:
  kagent: {}
  workload:
    # Substrate refuses an unpinned image: changing the image invalidates snapshots.
    # ghcr.io/kagent-dev/kagent/golang-adk:1.0.0-alpha9, multi-arch index digest.
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:26ae5c772d4a59b24ecb3619c3499e106e3b28abbc239de25b4ff8d746f97e69
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      # The value the product's own CI uses on kind. Where snapshots land is check 2.
      location: gs://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: baseline
  namespace: kagent
spec:
  templateRef:
    name: baseline
  harnessRef:
    name: kagent
