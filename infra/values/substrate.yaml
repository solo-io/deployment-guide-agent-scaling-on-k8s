# substrate-enterprise 0.4.0-alpha1-066b803, release `substrate` in `ate-system`.
# The license Secret is created before install from an environment variable, so no key is here.
global:
  licensing:
    createSecret: false
    secretName: enterprise-agentgateway-license
usePodCertificateAPI: true
credentialProvider:
  namespacePolicies:
    - atespace: kagent
      allowedNamespaces: [kagent]
# RustFS (the snapshot store) defaults to rustfsadmin/rustfsadmin. The chart cannot read these from
# a Secret: it writes them as plain values into the RustFS, bucket-init, atelet and ate-api pod specs.
# Pass non-default values at install time instead of committing them:
#   --set-string rustfs.accessKey="$RUSTFS_ACCESS_KEY" --set-string rustfs.secretKey="$RUSTFS_SECRET_KEY"
# The chart has no setting to disable the RustFS console (port 9001);
# infra/manifests/rustfs-networkpolicy.yaml blocks it.
