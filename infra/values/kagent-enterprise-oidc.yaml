# Overlay on kagent-enterprise.yaml: authenticate the UI and API against the reference Keycloak
# (infra/keycloak/) instead of the bundled IdP. Setting enterprise.oidc.issuer removes the bundled
# IdP sidecar and its /autoauth sign-in endpoint.
#
# The client secret is not here: Secret kagent/kagent-enterprise-oidc-secret, key clientSecret,
# is created from an environment variable before install.
enterprise:
  oidc:
    # Must equal the iss claim Keycloak writes (its KC_HOSTNAME), byte for byte, and be reachable
    # from both the browser and the controller (see infra/keycloak/coredns-localtest.sh).
    issuer: http://keycloak.localtest.me:18080/realms/kagent
    clientId: kagent-backend
    secretRef: kagent-enterprise-oidc-secret
    secretKey: clientSecret
