# kagent-enterprise 1.0.0-alpha8, release `kagent` in `kagent`.
# The license Secret `enterprise-kagent-license` is created before install from an environment
# variable, so no key is here.
global:
  cluster: sp03
enterprise:
  licensing:
    createSecret: false
  substrate:
    usePodCertificateAPI: true
kmcp:
  licensing:
    createSecret: false
controller:
  substrate:
    enabled: true
    ateApiEndpoint: "dns:///api.ate-system.svc:443"
    atenetRouterURL: "http://atenet-router.ate-system.svc:80"
# Platform capacity, not owned by any agent. Every AgentTemplate keeps a golden actor on a
# worker, so the pool must have at least one worker per template plus room for sessions.
substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 2
  sandboxClass: gvisor
  workerImage: us-docker.pkg.dev/solo-public/substrate-enterprise/ateom-gvisor:v0.4.0-alpha1-066b803
